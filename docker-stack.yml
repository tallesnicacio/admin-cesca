version: '3.8'

services:
  admin-cesca:
    image: admin-cesca:2026.07.16-safe-appointments.2
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        monitor: 30s
        order: stop-first
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.admin-cesca.rule=Host(`admin.cesca.digital`)"
        - "traefik.http.routers.admin-cesca.entrypoints=websecure"
        - "traefik.http.routers.admin-cesca.tls=true"
        - "traefik.http.routers.admin-cesca.tls.certresolver=letsencrypt"
        - "traefik.http.services.admin-cesca.loadbalancer.server.port=80"
        - "traefik.http.routers.admin-cesca-http.rule=Host(`admin.cesca.digital`)"
        - "traefik.http.routers.admin-cesca-http.entrypoints=web"
        - "traefik.http.routers.admin-cesca-http.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    environment:
      - NODE_ENV=production
    networks:
      - network_public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin-cesca-api:
    image: admin-cesca-api:2026.07.16-safe-appointments.2
    environment:
      - DATABASE_URL=postgresql://admin_cesca_user:AdminCesca2024!Secure@dsaas-postgres:5432/admin_cesca
      - JWT_SECRET=c5439c0743b3847ec0890120bf232023a64bc9a1798c681c116997a8be1d3574b9514b4d51dcff17c8eacfe366a1f10d
      - RESEND_API_KEY=re_dnCs8W19_MS9jbUydTNgnugEYy6gpv2Qo
      - APP_URL=https://admin.cesca.digital
      - PORT=3010
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - network_public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  network_public:
    external: true
